[project]
name = "taptutor-tabpfn-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.118.0",
  "pydantic==2.12.3",
  "uvicorn==0.37.0",
]

[project.optional-dependencies]
model = ["tabpfn==2.2.1", "torch==2.8.0+cpu", "numpy==2.2.6"]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.13.3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
